# ── Puerto ──────────────────────────────────────
server.port=8083

# ── Oracle DB ───────────────────────────────────
spring.datasource.url=jdbc:oracle:thin:@//oracle-db:1521/XEPDB1
spring.datasource.username=pedidos_user
spring.datasource.password=pedidos_pass
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ── JPA / Hibernate ──────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Nombre de la app ─────────────────────────────
spring.application.name=ms-pedidos

app.ms-usuarios.url=http://localhost:8082/api/v1/usuarios
app.ms-productos.url=http://localhost:8081/api/v1/productos